<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Opening Hours */
      .opening-hours {
        width: 100%;
        max-width: 450px;
        padding: 30px;
        background-color: #f8f5ef;
        border-radius: 10px;
        box-sizing: border-box;
      }

      .opening-hours h2 {
        margin-bottom: 20px;
        text-align: center;
      }

      .hours-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .hours-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid #ddd;
      }

      .hours-row span:first-child {
        font-weight: 600;
      }

      .hours-row span:last-child {
        text-align: right;
      }

      #opening-status {
        margin-top: 20px;
        text-align: center;
        font-weight: 600;
      }

      @media (max-width: 600px) {
        .opening-hours {
          max-width: 100%;
          padding: 20px;
        }

        .hours-row {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <section class="opening-hours">
      <h2>Opening Hours</h2>

      <div class="hours-list">
        <div class="hours-row">
          <span>Monday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Tuesday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Wednesday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Thursday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Friday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Saturday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>

        <div class="hours-row">
          <span>Sunday</span>
          <span>11:00 AM - 10:00 PM</span>
        </div>
      </div>

      <p id="opening-status"></p>
    </section>
    <script>
      const openingHours = {
        0: { open: 11, close: 22 }, // Sunday
        1: { open: 11, close: 22 }, // Monday
        2: { open: 11, close: 22 }, // Tuesday
        3: { open: 11, close: 22 }, // Wednesday
        4: { open: 11, close: 22 }, // Thursday
        5: { open: 11, close: 22 }, // Friday
        6: { open: 11, close: 22 }, // Saturday
      };

      function updateOpeningStatus() {
        const now = new Date();
        const day = now.getDay();
        const currentHour = now.getHours();
        const currentMinutes = now.getMinutes();

        const statusMessage = document.getElementById("opening-status");
        const today = openingHours[day];

        const currentTime = currentHour * 60 + currentMinutes;
        const openingTime = today.open * 60;
        const closingTime = today.close * 60;

        if (currentTime >= openingTime && currentTime < closingTime) {
          statusMessage.textContent = "● Open Now — Closes at 10:00 PM";
        } else {
          statusMessage.textContent = "● Closed Now — Opens at 11:00 AM";
        }
      }

      updateOpeningStatus();
    </script>
  </body>
</html>
